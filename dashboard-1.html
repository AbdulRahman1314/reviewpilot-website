<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReviewPilot: Owner dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f5f6f8;--s:#fff;--t:#0f1f3d;--m:#5b6578;--b:#dfe3ea;--p:#0f1f3d;--pt:#fff;--ok:#0b8a5f;--okb:#e6f6ef;--ac:#5b5bd6;--wb:#fff6e0;--wt:#6b4a00;--er:#c2331f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--s:#131c2e;--t:#eef1f7;--m:#9aa6bd;--b:#26324a;--p:#eef1f7;--pt:#0b1220;--ok:#3ccf98;--okb:#12302a;--ac:#8c8cf0;--wb:#2d2610;--wt:#f1d58a;--er:#ff8a78}}
:root[data-theme="dark"]{--bg:#0b1220;--s:#131c2e;--t:#eef1f7;--m:#9aa6bd;--b:#26324a;--p:#eef1f7;--pt:#0b1220;--ok:#3ccf98;--okb:#12302a;--ac:#8c8cf0;--wb:#2d2610;--wt:#f1d58a;--er:#ff8a78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{background:var(--s);border-bottom:1px solid var(--b);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:16px}header span{font-size:12px;color:var(--m)}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--m);margin:0 0 16px}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}.stat small{color:var(--m);font-size:12.5px}
.banner{background:var(--wb);color:var(--wt);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.o{font-weight:400;color:var(--m)}
input[type=text],input[type=tel]{width:100%;font:inherit;color:var(--t);background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chk{display:flex;gap:10px;font-weight:400;font-size:14px;align-items:flex-start}.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px;cursor:pointer;background:var(--p);color:var(--pt);margin-top:12px}
.btn.g{background:#0b8a5f;color:#fff}.btn.s{background:transparent;color:var(--t);border:1px solid var(--b)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--er);font-size:13px;margin-top:6px;min-height:18px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--b)}
.row:first-child{border-top:0}.row small{color:var(--m);display:block;font-size:12.5px}
.badge{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--okb);color:var(--ok);white-space:nowrap}
.badge.n{background:var(--bg);color:var(--m);border:1px solid var(--b)}.badge.w{background:var(--wb);color:var(--wt)}
.link{word-break:break-all;font-size:13px;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0}
.empty{text-align:center;color:var(--m);padding:24px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12.5px;color:var(--m);padding:12px 4px;cursor:pointer}
nav button[aria-current=page]{color:var(--t);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
#qr svg{width:220px;height:220px;display:block;margin:12px auto;background:#fff;padding:8px;border-radius:8px}
.sm{font-size:12.5px;color:var(--m)}
</style>
</head>
<body>
<header><div><b>ReviewPilot</b><br><span id="biz">Your Business Name</span></div><span>Preview mode</span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
// Set this to the real feedback page address. Each request adds its own token after the #.
var FEEDBACK_BASE = "https://abdulrahman1314.github.io/reviewpilot-website/feedback.html";
var BIZ = "Your Business Name";
var S = {c: [], r: []}, view = "home", last = null;
try { var x = localStorage.getItem("rp_state"); if (x) S = JSON.parse(x); } catch (e) {}
function save(){ try { localStorage.setItem("rp_state", JSON.stringify(S)); } catch (e) {} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(id){ return document.getElementById(id); }
function normPhone(v){
  var d = v.replace(/\D/g, "");
  if (d.length === 10 && /^[6-9]/.test(d)) return "91" + d;
  if (d.length === 12 && d.indexOf("91") === 0 && /^[6-9]/.test(d[2])) return d;
  return null;
}
function mask(p){ return "+" + p.slice(0, 2) + " " + p.slice(2, 4) + "••••• " + p.slice(-3); }
function token(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function cust(id){ return S.c.filter(function(c){ return c.id === id; })[0]; }

var tabs = [["home","Home"],["new","New request"],["list","Requests"],["qr","QR code"]];
function nav(){
  $("nav").innerHTML = tabs.map(function(t){ return '<button data-v="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'; }).join("");
  [].forEach.call($("nav").children, function(b){ b.onclick = function(){ go(b.dataset.v); }; });
}
function go(v){ view = v; last = null; render(); window.scrollTo(0, 0); }

function render(){ nav(); ({home: home, "new": newReq, list: list, qr: qr})[view](); }

function home(){
  var shared = S.r.filter(function(r){ return r.status === "shared"; }).length;
  var html = '<h2>Welcome</h2><p class="sub">Add a customer, create a feedback link, and share it on WhatsApp.</p>' +
  '<div class="grid">' +
  '<div class="stat"><b>'+S.c.length+'</b><small>Customers</small></div>' +
  '<div class="stat"><b>'+S.r.length+'</b><small>Requests created</small></div>' +
  '<div class="stat"><b>'+shared+'</b><small>Shared by you on WhatsApp</small></div>' +
  '<div class="stat"><b>0</b><small>Feedback received</small></div></div>' +
  '<div class="banner">Delivery tracking, feedback received and Google link clicks need the backend and WhatsApp Business API. Until then these show 0, not made-up numbers.</div>';
  if (!S.r.length) html += '<div class="card empty">Your business analytics will appear here after you collect your first customer feedback.</div>';
  html += '<button class="btn" id="q1">Create feedback request</button>';
  $("app").innerHTML = html; $("q1").onclick = function(){ go("new"); };
}

function newReq(){
  if (last) return done();
  $("app").innerHTML = '<h2>New feedback request</h2><p class="sub">Fill the customer details, then share the link.</p>' +
  '<form class="card" id="f" novalidate>' +
  '<label for="n">Customer name <span class="o">(optional)</span></label><input type="text" id="n" autocomplete="off">' +
  '<label for="p">Mobile number</label><input type="tel" id="p" inputmode="numeric" placeholder="10-digit Indian number" autocomplete="off">' +
  '<label for="t">Bill or transaction number <span class="o">(optional)</span></label><input type="text" id="t" autocomplete="off">' +
  '<label for="i">Product or service <span class="o">(optional)</span></label><input type="text" id="i" autocomplete="off">' +
  '<label class="chk" style="margin-top:16px"><input type="checkbox" id="c"><span>This customer agreed to receive messages from my store on WhatsApp.</span></label>' +
  '<div class="err" id="e" role="alert"></div>' +
  '<button class="btn" type="submit">Create link</button></form>';
  $("f").onsubmit = function(ev){
    ev.preventDefault();
    var ph = normPhone($("p").value), txn = $("t").value.trim(), err = $("e");
    if (!ph) { err.textContent = "Enter a valid 10-digit mobile number."; return; }
    if (!$("c").checked) { err.textContent = "Tick the box to confirm the customer agreed to receive messages."; return; }
    var c = S.c.filter(function(x){ return x.phone === ph; })[0];
    if (c && c.optOut) { err.textContent = "This customer has opted out. You cannot send them messages."; return; }
    if (txn && S.r.some(function(r){ return r.txn === txn; })) { err.textContent = "A request for this bill number already exists."; return; }
    var recent = S.r.some(function(r){ return c && r.cid === c.id && Date.now() - r.created < 7*864e5; });
    if (recent && !confirm("This customer got a request in the last 7 days. Create another?")) return;
    if (!c) { c = {id: "c" + token(), name: $("n").value.trim(), phone: ph, optOut: false, created: Date.now()}; S.c.push(c); }
    else if ($("n").value.trim()) c.name = $("n").value.trim();
    var r = {id: "r" + token(), token: token(), cid: c.id, txn: txn, item: $("i").value.trim(), status: "created", created: Date.now(), consentAt: Date.now()};
    S.r.unshift(r); save(); last = r.id; render();
  };
}

function msg(r){
  var c = cust(r.cid), name = c.name ? " " + c.name : "";
  return "Hello" + name + ",\n\nThank you for visiting " + BIZ + ". We would appreciate your honest feedback:\n" + FEEDBACK_BASE + "#" + r.token + "\n\nReply STOP if you do not wish to receive further messages from us.";
}
function done(){
  var r = S.r.filter(function(x){ return x.id === last; })[0], c = cust(r.cid), m = msg(r);
  $("app").innerHTML = '<h2>Link ready</h2><p class="sub">For ' + esc(c.name || mask(c.phone)) + '. Check the message, then send.</p>' +
  '<div class="card"><div class="sm">Message preview</div><div class="link" style="white-space:pre-wrap">' + esc(m) + '</div>' +
  '<a class="btn g" id="wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/' + c.phone + '?text=' + encodeURIComponent(m) + '">Open WhatsApp to send</a>' +
  '<button class="btn s" id="cp">Copy message</button><div class="sm" id="st" style="margin-top:8px" aria-live="polite"></div></div>' +
  '<button class="btn s" id="nx">Create another</button>';
  $("wa").onclick = function(){ r.status = "shared"; save(); $("st").textContent = "Marked as shared. WhatsApp will open and you press send there. Delivery is not tracked yet."; };
  $("cp").onclick = function(){ try { navigator.clipboard.writeText(m).then(function(){ $("st").textContent = "Message copied."; }, function(){ $("st").textContent = "Could not copy. Select the text above instead."; }); } catch (e) { $("st").textContent = "Could not copy. Select the text above instead."; } };
  $("nx").onclick = function(){ last = null; render(); };
}

function list(){
  var h = '<h2>Requests</h2><p class="sub">Status is what you did in this app, not WhatsApp delivery.</p>';
  if (!S.r.length) { $("app").innerHTML = h + '<div class="card empty">No requests yet. Create your first one.</div>'; return; }
  h += '<div class="card">' + S.r.map(function(r){
    var c = cust(r.cid);
    return '<div class="row"><div><b>' + esc(c.name || mask(c.phone)) + '</b><small>' + new Date(r.created).toLocaleDateString("en-IN") + (r.txn ? " · Bill " + esc(r.txn) : "") + (c.optOut ? ' · Opted out' : '') + '</small></div>' +
      '<div style="text-align:right"><span class="badge ' + (r.status === "shared" ? '' : 'n') + '">' + (r.status === "shared" ? "Shared on WhatsApp" : "Link created") + '</span><br>' +
      '<button class="sm" data-o="' + c.id + '" style="background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;font:inherit;font-size:12.5px">' + (c.optOut ? "Allow messages" : "Mark opted out") + '</button></div></div>';
  }).join("") + '</div>';
  $("app").innerHTML = h;
  [].forEach.call(document.querySelectorAll("[data-o]"), function(b){ b.onclick = function(){ var c = cust(b.dataset.o); c.optOut = !c.optOut; save(); list(); }; });
}

function qr(){
  var url = FEEDBACK_BASE;
  var svg = "";
  try { var q = qrcode(0, "M"); q.addData(url); q.make(); svg = q.createSvgTag({cellSize: 4, margin: 0, scalable: true}); } catch (e) {}
  $("app").innerHTML = '<h2>Counter QR code</h2><p class="sub">Print this and keep it at your counter. Customers scan it to give feedback, no phone number needed.</p>' +
  '<div class="card"><div id="qr">' + (svg || '<div class="empty">QR code could not load. Check your internet connection.</div>') + '</div><div class="link">' + esc(url) + '</div>' +
  '<p class="sm">This opens the preview feedback page. In the full product it will open your own store page.</p></div>';
}
$("biz").textContent = BIZ;
render();
</script>
</body>
</html>
